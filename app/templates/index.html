<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АС СКЛ v2.0 — Согласование кабельных линий</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
:root {
  --navy:#0E1B33; --navy2:#1A2A4A; --blue:#2E5C8A; --blue2:#3A7BCC;
  --green:#7AB648; --red:#C62828; --amber:#F57F17;
  --border:#2E4060; --bg:#0A1220; --card:#112244;
  --text:#E0E8F5; --muted:#7A94B8; --light:#A8C4E8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* Header */
.header{background:var(--navy2);border-bottom:2px solid var(--green);
  display:flex;align-items:center;padding:0 20px;height:52px;gap:16px;flex-shrink:0}
.logo{font-size:18px;font-weight:700;color:#fff}
.badge{background:var(--green);color:#fff;padding:2px 10px;border-radius:12px;
  font-size:11px;font-weight:600}
.header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.header-right .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:380px;background:var(--navy2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:12px;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.sidebar-content{flex:1;overflow-y:auto;padding:16px}
.sidebar-content::-webkit-scrollbar{width:4px}
.sidebar-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Map */
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}
.map-overlay{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:1000}
.map-btn{background:var(--navy2);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;
  transition:background .15s}
.map-btn:hover{background:var(--blue)}
.map-btn.active{background:var(--blue);border-color:var(--blue2)}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:14px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--green);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}

/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:28px 16px;
  text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue2);background:rgba(46,92,138,.15)}
.upload-zone .icon{font-size:32px;margin-bottom:8px}
.upload-zone p{color:var(--muted);font-size:13px}
.upload-zone strong{color:var(--text);display:block;margin-bottom:4px;font-size:14px}

/* Inputs */
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:6px;font-size:13px;width:100%;
  outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--blue2)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;margin-top:10px}

/* Buttons */
.btn{background:var(--blue);color:#fff;border:none;padding:10px 18px;
  border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;
  transition:background .15s;display:flex;align-items:center;gap:6px}
.btn:hover{background:var(--blue2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--green)}
.btn-green:hover{background:#8BC34A}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card)}
.btn-red{background:var(--red)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:6px;padding:10px 12px;border:1px solid var(--border)}
.stat-val{font-size:22px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:3px}
.stat.crit .stat-val{color:var(--red)}
.stat.imp  .stat-val{color:var(--amber)}
.stat.ok   .stat-val{color:var(--green)}
.stat.info .stat-val{color:var(--blue2)}

/* Approval list */
.approval-item{background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s}
.approval-item:hover{border-color:var(--blue2)}
.approval-item.selected{border-color:var(--blue2);background:rgba(46,92,138,.12)}
.approval-item .ai-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.approval-item .ai-name{font-size:13px;font-weight:600;color:var(--text)}
.approval-item .ai-basis{font-size:11px;color:var(--muted);margin-left:auto}
.approval-item .ai-ref{font-size:11px;color:var(--muted);margin-bottom:6px}
.approval-item .ai-footer{display:flex;gap:6px;align-items:center}
.priority-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.priority-critical{background:rgba(198,40,40,.2);color:#EF9A9A}
.priority-important{background:rgba(245,127,23,.2);color:#FFCC80}
.priority-recommended{background:rgba(122,182,72,.15);color:#A5D6A7}
.status-badge{padding:2px 8px;border-radius:10px;font-size:10px;
  background:rgba(122,182,72,.15);color:var(--green)}

/* Parcel popup */
.parcel-popup{background:var(--navy2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:12px;min-width:200px;font-size:12px}
.parcel-popup b{color:var(--light)}

/* Alert */
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.alert-info{background:rgba(46,92,138,.25);border:1px solid var(--blue)}
.alert-ok{background:rgba(122,182,72,.2);border:1px solid var(--green)}
.alert-err{background:rgba(198,40,40,.2);border:1px solid var(--red)}
.alert-warn{background:rgba(245,127,23,.2);border:1px solid var(--amber)}

/* Progress */
.steps{display:flex;gap:4px;margin-bottom:16px}
.step{flex:1;height:4px;background:var(--border);border-radius:2px;transition:background .3s}
.step.done{background:var(--green)}
.step.active{background:var(--blue2)}

/* Spinner */
.spin{display:inline-block;width:16px;height:16px;border:2px solid transparent;
  border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Intersection marker tooltip */
.leaflet-popup-content-wrapper{background:var(--navy2)!important;
  border:1px solid var(--border)!important;color:var(--text)!important;
  border-radius:8px!important;box-shadow:none!important}
.leaflet-popup-tip{background:var(--navy2)!important}
.leaflet-popup-content{margin:12px!important;font-family:system-ui!important}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>

<script src="/static/app.js"></script>
</body>
</html>
