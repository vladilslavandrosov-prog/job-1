version: "3.9"

services:
  backend:
    build: ./backend
    container_name: as_skl_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/data/sample:/app/data/sample
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=as-skl-change-me-in-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: as_skl_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
