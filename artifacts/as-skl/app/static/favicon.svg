<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6472"/>
      <stop offset="1" stop-color="#363C44"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- кабельная трасса: диагональ с опорами, акцентный цвет -->
  <path d="M10 44 L27 30 L54 16"
        fill="none" stroke="#FF6A2B" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="10" cy="44" r="4.5" fill="#FFFFFF"/>
  <circle cx="27" cy="30" r="4.5" fill="#FFFFFF"/>
  <circle cx="54" cy="16" r="4.5" fill="#FFFFFF"/>

  <!-- бейдж «согласовано» -->
  <circle cx="47" cy="48" r="14" fill="#2E9E5B" stroke="#363C44" stroke-width="3"/>
  <path d="M40.5 48 L45 52.5 L54 41.5" fill="none" stroke="#FFFFFF"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
